<!DOCTYPE html>
<html>
<head>
    <title>Student Grade Evaluator</title>
</head>

<body>
<h1>Student Grade Evaluator</h1><br>

<label>Student Name:</label><br>
<input type="text" id="studentName"><br><br>

<label>Grade 1:</label><br>
<input type="number" id="grade1"><br><br>

<label>Grade 2:</label><br>
<input type="number" id="grade2"><br><br>

<label>Grade 3:</label><br>
<input type="number" id="grade3"><br><br>

<button onclick="compute()">Compute</button>
<button onclick="clearForm()">Clear</button>

<h3>Result</h3>
<h4>Name: <span id="nameOfStudent"></span></h4>
<h4>Average: <span id="studentAverage"></span></h4>
<h4>Remark: <span id="studentRemark"></span></h4>


<script>
function compute(){
    let name = document.getElementById("studentName").value;
    let grade1 = Number(document.getElementById("grade1").value);
    let grade2 = Number(document.getElementById("grade2").value);
    let grade3 = Number(document.getElementById("grade3").value);

    let average = (grade1 + grade2 + grade3) / 3;

    let remark;
    if (average >= 90){
        remark = "Excellent";
    }
    else if (average >= 85){
        remark = "Very Good";
    }
    else if (average >= 80){
        remark = "Good";
    }
    else if (average >= 75){
        remark = "Passed";
    }
    else {
        remark = "Failed";
    }

    document.getElementById("nameOfStudent").innerText = name;
    document.getElementById("studentAverage").innerText = average.toFixed(2);
    document.getElementById("studentRemark").innerText = remark;
}

function clearForm(){
    document.getElementById("studentName").value = "";
    document.getElementById("grade1").value = "";
    document.getElementById("grade2").value = "";
    document.getElementById("grade3").value = "";

    document.getElementById("nameOfStudent").innerText = "";
    document.getElementById("studentAverage").innerText = "";
    document.getElementById("studentRemark").innerText = "";
}
</script>

</body>
</html>
